info:
  name: Excluir cliente com id ignorado
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/clientes/:id"
  params:
    - name: id
      value: "{{clienteIdIgnorado}}"
      type: path

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar 204 sem corpo", function () {
          expect(res.getStatus()).to.equal(204);
          expect(res.getBody()).to.be.oneOf([null, ""]);
        });

docs: |-
  Remove o cliente criado em `08 - Criar cliente ignora id`.

  Dependência: rode `08 - Criar cliente ignora id` antes.

  Esperado: `204` sem corpo. O cliente de exemplo com id 1 permanece.
