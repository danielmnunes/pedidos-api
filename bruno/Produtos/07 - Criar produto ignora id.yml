info:
  name: Criar produto ignora id
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/produtos"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "id": 1,
        "nome": "Produto com id informado {{$timestamp}}",
        "categoria": "Teste",
        "preco": 15.00,
        "estoque": 2
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

runtime:
  scripts:
    - type: tests
      code: |-
        test("deve retornar 201 com id gerado", function () {
          expect(res.getStatus()).to.equal(201);
          const id = res.getBody().id;
          expect(id).to.be.a("number").and.to.not.equal(1);
          expect(res.getHeader("location")).to.equal("/produtos/" + id);
          expect(res.getBody().estoque).to.equal(2);
        });

        test("deve guardar o id gerado para exclusão", function () {
          bru.setVar("produtoIdIgnorado", res.getBody().id);
        });

docs: |-
  Envia `id` 1, que já pertence ao teclado mecânico. A API ignora esse valor e grava outro id.

  Esperado: `201` com `id` diferente de 1.

  Efeito colateral: grava `produtoIdIgnorado` para `08 - Excluir produto com id ignorado`.
