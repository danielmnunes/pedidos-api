spring.application.name=pedidos-api
spring.application.name=pedidos-api

spring.datasource.url=jdbc:sqlite:./data/pedidos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite não é tratado como banco embarcado; data.sql só roda com mode=always
spring.sql.init.mode=always

# RFC 9457: erros HTTP em application/problem+json
spring.mvc.problemdetails.enabled=true

spring.threads.virtual.enabled=true

# Scalar (scalar.com) em /scalar; OpenAPI JSON em /v3/api-docs
scalar.path=/scalar
scalar.page-title=Pedidos API
scalar.theme=kepler
scalar.dark-mode=true
scalar.layout=modern